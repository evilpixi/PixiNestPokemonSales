<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixi Pokemon Sales</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Pixi Pokemon Sales</h1>
    </header>

    <main>
      <section class="card" id="form-card">
        <h2 id="form-title">Agregar pokemon</h2>
        <form id="pokemon-form">
          <input type="hidden" id="pokemon-id" />
          <label>
            Nombre
            <input type="text" id="pokemon-name" required />
          </label>
          <label>
            Nivel
            <input type="number" id="pokemon-level" min="1" required />
          </label>
          <label>
            Precio
            <input type="number" id="pokemon-price" min="0" step="0.01" required />
          </label>
          <div class="form-actions">
            <button type="submit" id="submit-btn">Agregar</button>
            <button type="button" id="cancel-edit-btn" hidden>Cancelar</button>
          </div>
        </form>
        <p id="form-error" class="error" hidden></p>
      </section>

      <section class="card">
        <div class="list-header">
          <h2>Pokemons</h2>
          <div class="filters">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="available">Disponibles</button>
            <button class="filter-btn" data-filter="sold">Vendidos</button>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Nivel</th>
              <th>Precio</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="pokemon-tbody"></tbody>
        </table>
        <p id="empty-state" hidden>No hay pokemons para mostrar.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
